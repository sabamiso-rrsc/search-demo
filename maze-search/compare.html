<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="同じ迷路をBFSとDFSが同時に探索する比較デモ" />
    <title>BFS・DFS 同時比較</title>
    <link rel="stylesheet" href="../search-demo/controls.css" />
    <link rel="stylesheet" href="compare.css" />
  </head>
  <body>
    <main class="app">
      <div class="color-guide" aria-label="両方の迷路に共通する色の説明">
        <span class="guide-title">色の見かた</span>
        <div class="shared-order" aria-label="探索候補は赤を先に、白を後で探索します">
          <span>赤・先に探索</span><span>白・後で探索</span>
          <i aria-hidden="true"></i>
        </div>
        <div class="legend">
          <span><i class="start"></i>スタート</span>
          <span><i class="goal"></i>ゴール</span>
          <span><i class="current"></i>現在地</span>
          <span><i class="visited"></i>探索済み</span>
          <span><i class="path"></i>発見した経路</span>
        </div>
      </div>

      <div class="comparison">
        <section class="algorithm-panel" aria-labelledby="bfs-title">
          <header class="panel-heading">
            <div>
              <h1 id="bfs-title">BFS <span>幅優先探索</span></h1>
              <p>近いマスから順に調べる</p>
            </div>
          </header>

          <div class="maze-frame" id="bfs-frame">
            <canvas id="bfs-maze" aria-label="幅優先探索の迷路"></canvas>
            <div class="current-label" id="bfs-current" hidden>いまここ</div>
          </div>

          <div class="stats" aria-label="幅優先探索の結果">
            <div class="status" id="bfs-status" role="status" aria-live="polite"><i aria-hidden="true"></i><span>準備中</span></div>
            <span>探索 <strong id="bfs-visited">0</strong>マス</span>
            <span>経路 <strong id="bfs-path">—</strong></span>
          </div>
        </section>

        <section class="algorithm-panel dfs-panel" aria-labelledby="dfs-title">
          <header class="panel-heading">
            <div>
              <h1 id="dfs-title">DFS <span>深さ優先探索</span></h1>
              <p>一つの道を奥まで調べる</p>
            </div>
          </header>

          <div class="maze-frame" id="dfs-frame">
            <canvas id="dfs-maze" aria-label="深さ優先探索の迷路"></canvas>
            <div class="current-label" id="dfs-current" hidden>いまここ</div>
          </div>

          <div class="stats" aria-label="深さ優先探索の結果">
            <div class="status" id="dfs-status" role="status" aria-live="polite"><i aria-hidden="true"></i><span>準備中</span></div>
            <span>探索 <strong id="dfs-visited">0</strong>マス</span>
            <span>経路 <strong id="dfs-path">—</strong></span>
          </div>
        </section>
      </div>

      <!-- Watching the boards: slow down or try another maze right below them. -->
      <div class="playback">
        <label class="speed" for="speed">
          <span>速度</span>
          <input id="speed" type="range" min="1" max="5" value="3" />
          <strong id="speed-label">ふつう</strong>
        </label>
        <button id="new-maze" class="ctl" type="button">新しい迷路にする</button>
      </div>
    </main>

    <script src="../search-demo/bridge.js"></script>
    <script src="compare.js"></script>
  </body>
</html>
